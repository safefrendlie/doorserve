<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feed · DoorServe</title>
  <meta name="theme-color" content="#0B7473">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230B7473'/%3E%3Cpath d='M11 24V8h5a8 8 0 010 16z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("ds-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* keep default */ }
    })();
  </script>
</head>
<body data-page="feed">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="feed.html" aria-label="DoorServe feed">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span class="brand-name">DoorServe</span>
      </a>
      <nav class="topnav" aria-label="Main">
        <a href="feed.html" aria-current="page">Feed</a>
        <a href="profile.html" id="navProfile">Profile</a>
      </nav>
      <div class="topbar-actions">
        <button id="themeToggle" class="icon-btn" type="button" aria-label="Switch light or dark theme"></button>
        <a id="navAvatarLink" class="avatar-link" href="profile.html" aria-label="Your profile"></a>
        <button id="signOutBtn" class="btn btn-ghost btn-sm" type="button">Sign out</button>
      </div>
    </div>
  </header>

  <main class="feed-layout">
    <section class="composer card" aria-label="Create a post">
      <form id="composer" novalidate>
        <label class="sr-only" for="postText">What do you need, or what would you like to share?</label>
        <textarea id="postText" maxlength="1000" rows="3" placeholder="Need a hand? Ask your neighbours, or share a job you’re proud of."></textarea>
        <div id="imageRow" class="image-row" hidden>
          <label class="sr-only" for="postImage">Image link</label>
          <input id="postImage" type="url" inputmode="url" placeholder="https://… link to an image">
        </div>
        <div class="composer-bar">
          <button id="toggleImage" class="btn btn-ghost btn-sm" type="button">Add image link</button>
          <span id="charCount" class="muted small">0 / 1000</span>
          <button id="postBtn" class="btn btn-primary btn-sm" type="submit">Post</button>
        </div>
        <p id="composerError" class="form-error" role="alert" hidden></p>
      </form>
    </section>

    <p id="feedStatus" class="empty">Loading posts…</p>
    <div id="feed" class="feed" aria-live="polite"></div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
