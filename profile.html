<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · DoorServe</title>
  <meta name="theme-color" content="#0B7473">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230B7473'/%3E%3Cpath d='M11 24V8h5a8 8 0 010 16z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("ds-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* keep default */ }
    })();
  </script>
</head>
<body data-page="profile">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="feed.html" aria-label="DoorServe feed">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span class="brand-name">DoorServe</span>
      </a>
      <nav class="topnav" aria-label="Main">
        <a href="feed.html">Feed</a>
        <a href="profile.html" id="navProfile">Profile</a>
      </nav>
      <div class="topbar-actions">
        <button id="themeToggle" class="icon-btn" type="button" aria-label="Switch light or dark theme"></button>
        <a id="navAvatarLink" class="avatar-link" href="profile.html" aria-label="Your profile"></a>
        <button id="signOutBtn" class="btn btn-ghost btn-sm" type="button">Sign out</button>
      </div>
    </div>
  </header>

  <main class="profile-layout">
    <section class="profile card" aria-label="Profile">
      <div id="banner" class="banner"></div>
      <div class="profile-body">
        <div id="profileAvatar"></div>
        <div class="profile-head">
          <h1 id="profileName">Loading…</h1>
          <div class="chips">
            <span id="roleChip" class="chip"></span>
            <span id="verifyChip" class="chip chip-muted"></span>
          </div>
        </div>
        <button id="editBtn" class="btn btn-ghost btn-sm" type="button" hidden>Edit profile</button>
      </div>
      <p id="profileBio" class="bio"></p>
      <p id="profileMeta" class="muted small"></p>
    </section>

    <div class="tabs" role="tablist" aria-label="Filter posts">
      <button type="button" role="tab" data-tab="all" aria-selected="true">All posts</button>
      <button type="button" role="tab" data-tab="photos" aria-selected="false">Photos</button>
      <button type="button" role="tab" data-tab="text" aria-selected="false">Text</button>
    </div>

    <p id="profileStatus" class="empty">Loading posts…</p>
    <div id="profilePosts" class="feed" aria-live="polite"></div>
  </main>

  <dialog id="editDialog" aria-labelledby="editTitle">
    <div class="dialog-inner">
      <h2 id="editTitle">Edit profile</h2>
      <form id="editForm">
        <div class="field">
          <label for="editName">Name</label>
          <input id="editName" type="text" maxlength="60" required>
        </div>
        <div class="field">
          <label for="editBio">Bio</label>
          <textarea id="editBio" maxlength="280" rows="3" placeholder="What you do, where you work, how people can reach you."></textarea>
        </div>
        <div class="field">
          <label for="editRole">I’m here to</label>
          <select id="editRole">
            <option value="user">Find local services</option>
            <option value="provider">Offer a service</option>
          </select>
        </div>
        <div class="field">
          <label for="editPhoto">Profile photo link</label>
          <input id="editPhoto" type="url" inputmode="url" placeholder="https://…">
        </div>
        <div class="field">
          <label for="editBanner">Banner image link</label>
          <input id="editBanner" type="url" inputmode="url" placeholder="https://…">
        </div>
        <p id="editError" class="form-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button id="editCancel" class="btn btn-ghost btn-sm" type="button">Cancel</button>
          <button id="editSave" class="btn btn-primary btn-sm" type="submit">Save changes</button>
        </div>
      </form>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
