<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DoorServe — Trusted local services</title>
  <meta name="description" content="Find trusted local electricians, plumbers, mechanics and more. Starting in Kashmir.">
  <meta name="theme-color" content="#0E6B73">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DoorServe">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    /* Theme before first paint + keep the "install app" prompt for later. */
    (function () {
      try {
        var t = localStorage.getItem("ds-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
      window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__bip = e; });
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="DoorServe home">
        <img src="icon-192.png" alt="" width="36" height="36">
        <span class="wordmark"><span class="w1">Door</span><span class="w2">Serve</span></span>
      </a>
      <nav id="topnav" class="topnav" aria-label="Main"></nav>
      <div class="topbar-actions">
        <a class="btn btn-primary btn-sm hide-mobile" href="#/request">Request a service</a>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="Switch light or dark theme"></button>
        <a id="acctLink" class="icon-btn hide-mobile" href="#/login" aria-label="Account"></a>
      </div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"><p class="empty">Loading…</p></main>

  <footer class="footer">
    <a href="#/about">About</a><a href="#/safety">Safety</a><a href="#/contact">Contact</a><a href="#/join">Join as a provider</a>
  </footer>

  <nav id="bottomnav" class="bottomnav" aria-label="Quick"></nav>

  <noscript><p class="empty">DoorServe needs JavaScript turned on.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
